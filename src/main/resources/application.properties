# ── Secretos ────────────────────────────────────────────────────
# Este archivo NO lleva ningún secreto (contraseñas, llaves). Cada uno se lee de una
# variable de entorno sin valor por defecto: si falta, la app no arranca (mejor que arrancar
# con una llave conocida). Producción (Coolify): DB_PASSWORD, APP_JWT_SECRET,
# APP_MAIL_USERNAME, APP_MAIL_PASSWORD (+ DB_URL / DB_USERNAME si no son los de abajo).
# Local: copia application-local.properties.example a application-local.properties (en la
# raíz del proyecto, ignorado por git) y pon ahí tus valores; se carga solo, si existe.
spring.config.import=optional:file:./application-local.properties

# ── DataSource ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restopos_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ──────────────────────────────────────────────────────
server.port=8081
# Detrás de un proxy (nginx/Coolify) poner APP_FORWARD_HEADERS=native para que la app vea la
# IP real del cliente (X-Forwarded-For) — la usa el límite de intentos. NO activarlo si el
# backend queda expuesto directo a internet: cualquiera podría falsificar su IP con ese header.
server.forward-headers-strategy=${APP_FORWARD_HEADERS:none}
server.servlet.context-path=/

# ── CORS ────────────────────────────────────────────────────────
# Orígenes del frontend permitidos a consumir la API (separados por coma, sin slash final;
# admiten comodines "*" por segmento, ver SecurityConfig#corsConfigurationSource).
# Dev: Vite/CRA local, más patrones de red LAN (192.168.x.x y 10.x.x.x) para poder entrar
# desde el celular u otra computadora de la misma red usando la IP de esta máquina
# (ej. http://192.168.1.77:5173). Prod: agregar aquí (o sobreescribir con la variable de
# entorno APP_CORS_ALLOWED_ORIGINS) el dominio real donde quede desplegado el frontend.
app.cors.allowed-origins=http://localhost:5173,http://192.168.1.77:5173,http://localhost:3000,http://192.168.*.*:5173,http://10.*.*.*:5173

# ── Archivos subidos (logos de tienda) ────────────────────────────
# Dev (por defecto): carpeta dentro del proyecto backend.
# Prod: Coolify no tiene disco persistente por contenedor — cada redeploy levanta un
# contenedor nuevo desde cero, así que lo escrito en una ruta relativa (logos, fotos de
# producto) se pierde en el siguiente deploy. Solución: montar un volumen persistente en
# Coolify (pestaña "Storages") en una ruta absoluta del contenedor (ej. /data/uploads) y
# apuntar aquí con APP_UPLOADS_DIR=/data/uploads — sobrevive a los redeploys mientras el
# volumen no se desmonte. El resto del código no cambia, solo esta propiedad.
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
# Archivos privados (comprobantes de transferencia de pedidos web): NO se sirven por
# /uploads/**, solo por GET /api/comprobantes/orden/{id} con sesión del personal. En prod
# también va en un volumen persistente, distinto al de uploads (ej. APP_PRIVATE_UPLOADS_DIR=/data/private-uploads).
app.private-uploads.dir=${APP_PRIVATE_UPLOADS_DIR:private-uploads}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ── JWT ─────────────────────────────────────────────────────────
# El valor real (rotado tras la exposición del secreto anterior en el repo público) vive
# SOLO en la variable de entorno APP_JWT_SECRET (Coolify) o, en local, en
# application-local.properties — nunca en este archivo. Mínimo 32 caracteres.
app.jwt.secret=${APP_JWT_SECRET}
# Access token JWT: vida corta a propósito (30 min) — la renovación transparente la da el
# refresh token de abajo (ver AuthService#refreshAccessToken), no extender este valor.
app.jwt.expiration=1800000
# Refresh token opaco (RefreshToken, no JWT): 8h, pensado para cubrir un turno de trabajo
# completo sin pedir login de nuevo. Viaja como cookie httpOnly (ver AuthController).
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:28800000}

# ── Cookie del refresh token ──────────────────────────────────────
# Dev (por defecto): frontend y backend son "mismo origen" desde la perspectiva del
# navegador gracias al proxy de Vite (ver vite.config.js), así que alcanza con
# secure=false (no hay HTTPS en local) y sameSite=Lax.
# Prod: frontend (sitio estático) y backend quedan en dominios distintos → la cookie es
# cross-site, así que Coolify DEBE sobreescribir con APP_COOKIE_SECURE=true y
# APP_COOKIE_SAMESITE=None (los navegadores exigen Secure=true junto con SameSite=None).
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.samesite=${APP_COOKIE_SAMESITE:Lax}

# ── Jackson ─────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Correo (envío de tickets en PDF) ─────────────────────────────
# Gmail con contraseña de aplicación: https://myaccount.google.com/apppasswords
# (requiere verificación en 2 pasos activada en la cuenta de Google). El valor real vive
# SOLO en la variable de entorno APP_MAIL_PASSWORD de Coolify — sin ella, el envío de
# correo simplemente falla en local (no bloquea el resto de la app).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Frontend ────────────────────────────────────────────────────
# URL del frontend, usada en el correo de contraseña temporal (link de login). Dev: Vite
# local. Prod: se sobreescribe con la variable de entorno APP_FRONTEND_URL apuntando al
# dominio real donde quede desplegado el frontend.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ── QZ Tray (firma de conexión para imprimir tickets) ─────────────
# Certificado público + llave privada que el backend usa para firmar cada conexión que el
# frontend hace a QZ Tray (ver utils/printer.js y QzSigningService). Sin firma, QZ Tray
# trata la conexión como "anónima": no puede recordar la autorización del cajero y la pide
# en cada cobro. Con firma, aunque el certificado sea autofirmado (no hace falta comprarlo),
# QZ Tray sí puede recordar la decisión de forma permanente.
# Los archivos NO se versionan (carpeta qz-keys/ en .gitignore, junto a uploads/) — se
# generan una sola vez por entorno y se leen de disco en local (rutas de abajo).
# En producción (Coolify) no hay disco persistente para montar archivos, así que ahí se usa
# el par en base64 vía variable de entorno (ver QzSigningService.load): generarlo una vez con
# `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private-key.pem` +
# `openssl req -new -x509 -key private-key.pem -out digital-certificate.pem -days 3650 -subj "/CN=RestoPOS"`,
# luego `base64 -w0 archivo.pem` y pegar el resultado en las variables de Coolify.
app.qz.certificate-path=${APP_QZ_CERT_PATH:qz-keys/digital-certificate.pem}
app.qz.private-key-path=${APP_QZ_KEY_PATH:qz-keys/private-key.pem}
app.qz.certificate-base64=${APP_QZ_CERTIFICATE_BASE64:}
app.qz.private-key-base64=${APP_QZ_PRIVATE_KEY_BASE64:}
